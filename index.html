<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Moments Magnets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fefefe;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: #00aaff;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    header p {
      margin: 5px 0 0;
      font-size: 1.2rem;
    }
    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    section {
      margin-bottom: 30px;
    }
    .gallery img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    select, button {
      padding: 10px;
      margin-top: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #00aaff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0088cc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sticky Moments Magnets</h1>
    <p>Turn your favorite moments and memories into magnets!</p>
  </header>

  <main>
    <!-- Photo Upload Section -->
    <section>
      <h2>Upload Your Photo</h2>
      <input type="file" id="photoUpload" accept="image/*"><br>
      <img id="preview" src="" alt="" style="display:none; width:200px; margin-top:10px;">
    </section>

    <!-- Magnet Type -->
    <section>
      <h2>Choose Magnet Type</h2>
      <select id="magnetType">
        <option value="white">White</option>
        <option value="blue">Blue</option>
        <option value="pink">Pink</option>
      </select>
    </section>

    <!-- Payment Option -->
    <section>
      <h2>Payment</h2>
      <select id="paymentOption">
        <option value="ideal">Pay Online (iDEAL)</option>
        <option value="cash">Cash on Delivery</option>
      </select><br>
      <button id="payButton">Submit Order</button>
    </section>

    <!-- Gallery -->
    <section>
      <h2>Gallery</h2>
      <div class="gallery">
        <img src="placeholder1.jpg" alt="Magnet 1">
        <img src="placeholder2.jpg" alt="Magnet 2">
        <img src="placeholder3.jpg" alt="Magnet 3">
      </div>
    </section>
  </main>

  <script>
    // Photo preview
    const photoUpload = document.getElementById('photoUpload');
    const preview = document.getElementById('preview');
    photoUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    // Payment
    const payButton = document.getElementById('payButton');
    const paymentOption = document.getElementById('paymentOption');

    // Replace with your actual iDEAL payment link
    const idealPaymentLink = 'https://pay.mollie.com/payscreen/your-unique-link';

    payButton.addEventListener('click', () => {
      if (paymentOption.value === 'ideal') {
        window.open(idealPaymentLink, '_blank');
      } else {
        alert('Your order has been received! Please pay cash on delivery.');
      }
    });
  </script>
</body>
</html>
