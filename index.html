<!DOCTYPE html>
<html>
<head>
  <title>Sticky Moments Magnets</title>
  <meta charset="UTF-8">
</head>

<body style="font-family: Arial; margin:0; background:white; text-align:center;">

  <!-- Header -->
  <div style="background:#2196F3; color:white; padding:20px;">
    <h1>Sticky Moments Magnets</h1>
    <p>Turn your favorite moments into lasting memories 💗</p>
  </div>

  <!-- Main Section -->
  <div style="padding:30px;">

    <h2 style="color:#E91E63;">
      Create your custom photo magnet ✨
    </h2>

    <p>Upload your favorite photo and make it stick forever!</p>

    <!-- Upload -->
    <input type="file"><br><br>

    <!-- Order -->
    <label>Choose quantity:</label><br>
    <input type="number" min="1"><br><br>

    <!-- Payment -->
    <label>Payment method:</label><br>
    <select>
      <option>Pay Online (iDEAL)</option>
      <option>Cash on Delivery</option>
    </select><br><br>

    <!-- Button -->
    <button style="
      background:#E91E63;
      color:white;
      padding:12px 25px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    ">
      Submit Order
    </button>

  </div>

  <!-- Footer -->
  <div style="background:#2196F3; color:white; padding:15px;">
    <p>Sticky Moments Magnets © 2026</p>
  </div>

</body>
</html>
